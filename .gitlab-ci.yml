stages:
  - test
  - build
  - deploy
  - teardown

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

default:
  image: node:24.15.0-alpine
  cache:
    key:
      files:
        - .nvmrc
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - grep -q $(node -v | cut -c2-) .nvmrc
    - >
      [[ -d node_modules ]] || npm ci

test:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"
  script:
    - npm run lint
    - npm run test
    - npm run build
  coverage: '/^Statements\s*:\s*([^%]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

container:image:
  stage: build
  image: docker:29.4.1
  before_script: []
  services:
    - docker:29.4.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$ENABLE_CONTAINER_BUILD == "true"'
      when: manual
    - when: never

deploy:
  stage: deploy
  image: registry.gitlab.com/newcubator/newcubator/ci-images/pulumi-gcloud-node:node24
  needs:
    - container:image
  variables:
    CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK: "1"
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    PULUMI_K8S_ENABLE_PATCH_FORCE: "true"
  environment:
    name: micro-bots-hubertus
    url: https://microbots.hubertus.newcubator.com
    deployment_tier: production
  resource_group: micro-bots-hubertus
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  rules:
    - if: >
        $CI_COMMIT_BRANCH == "main" &&
        $GCP_WORKLOAD_IDENTITY_PROVIDER &&
        $GCP_SERVICE_ACCOUNT &&
        $KUBERNETES_CONTEXT &&
        $GITLAB_REGISTRY_PULL_USERNAME &&
        $GITLAB_REGISTRY_PULL_PASSWORD &&
        $PULUMI_CONFIG_PASSPHRASE &&
        $SLACK_TOKEN &&
        $MOCO_TOKEN &&
        $GITLAB_TOKEN &&
        $GENERAL_CHANNEL &&
        $GITLAB_BOOK_PROJECT_ID &&
        $GITLAB_NEWCUBATOR_GROUP_ID
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never
  before_script:
    - test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || (echo "GCP_WORKLOAD_IDENTITY_PROVIDER is required" && exit 1)
    - test -n "$GCP_SERVICE_ACCOUNT" || (echo "GCP_SERVICE_ACCOUNT is required" && exit 1)
    - test -n "$PULUMI_CONFIG_PASSPHRASE" || (echo "PULUMI_CONFIG_PASSPHRASE is required" && exit 1)
    - test -n "$GITLAB_REGISTRY_PULL_USERNAME" || (echo "GITLAB_REGISTRY_PULL_USERNAME is required" && exit 1)
    - test -n "$GITLAB_REGISTRY_PULL_PASSWORD" || (echo "GITLAB_REGISTRY_PULL_PASSWORD is required" && exit 1)
    - test -n "$SLACK_TOKEN" || (echo "SLACK_TOKEN is required" && exit 1)
    - test -n "$MOCO_TOKEN" || (echo "MOCO_TOKEN is required" && exit 1)
    - test -n "$GITLAB_TOKEN" || (echo "GITLAB_TOKEN is required" && exit 1)
    - test -n "$GENERAL_CHANNEL" || (echo "GENERAL_CHANNEL is required" && exit 1)
    - test -n "$GITLAB_BOOK_PROJECT_ID" || (echo "GITLAB_BOOK_PROJECT_ID is required" && exit 1)
    - test -n "$GITLAB_NEWCUBATOR_GROUP_ID" || (echo "GITLAB_NEWCUBATOR_GROUP_ID is required" && exit 1)
    - echo "$GITLAB_OIDC_TOKEN" > "$CI_PROJECT_DIR/.ci_job_jwt_file"
    - >
      gcloud --quiet iam workload-identity-pools create-cred-config "$GCP_WORKLOAD_IDENTITY_PROVIDER"
      --service-account="$GCP_SERVICE_ACCOUNT"
      --output-file=/tmp/.gcp_temp_cred.json
      --credential-source-file="$CI_PROJECT_DIR/.ci_job_jwt_file"
    - gcloud --quiet auth login --cred-file=/tmp/.gcp_temp_cred.json
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/.gcp_temp_cred.json
    - cd infrastructure
    - npm ci
    - pulumi login gs://newcubator-pulumi
    - pulumi stack select production --create
  script:
    - pulumi config set kubernetes:context "$KUBERNETES_CONTEXT"
    - pulumi config set namespace micro-bots
    - pulumi config set domain microbots.hubertus.newcubator.com
    - pulumi config set imageRepository "$CI_REGISTRY_IMAGE"
    - pulumi config set imageTag "sha-$CI_COMMIT_SHORT_SHA"
    - pulumi config set suspendCronJobs "${SUSPEND_CRON_JOBS:-true}"
    - pulumi config set gitlabRegistryUsername "$GITLAB_REGISTRY_PULL_USERNAME"
    - pulumi config set --secret gitlabRegistryPassword "$GITLAB_REGISTRY_PULL_PASSWORD"
    - pulumi config set --secret slackToken "$SLACK_TOKEN"
    - pulumi config set --secret mocoToken "$MOCO_TOKEN"
    - pulumi config set --secret gitlabToken "$GITLAB_TOKEN"
    - pulumi config set --secret generalChannel "$GENERAL_CHANNEL"
    - pulumi config set --secret gitlabBookProjectId "$GITLAB_BOOK_PROJECT_ID"
    - pulumi config set --secret gitlabNewcubatorGroupId "$GITLAB_NEWCUBATOR_GROUP_ID"
    - pulumi up --yes --refresh --diff

teardown:aws:
  stage: teardown
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script: []
  variables:
    AWS_REGION: eu-central-1
    AWS_ROLE_ARN: arn:aws:iam::931595285256:role/GitlabCi
    AWS_STACK_NAME: micro-bots-production
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  when: manual
  script:
    - >
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}-teardown"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text))
    - aws sts get-caller-identity
    - TEARDOWN_DELETED=0
    - |
      if aws cloudformation describe-stacks --stack-name "$AWS_STACK_NAME" >/dev/null 2>&1; then
        DEPLOYMENT_BUCKET="$(aws cloudformation describe-stack-resource --stack-name "$AWS_STACK_NAME" --logical-resource-id ServerlessDeploymentBucket --query 'StackResourceDetail.PhysicalResourceId' --output text 2>/dev/null || true)";
        if [ -n "$DEPLOYMENT_BUCKET" ] && [ "$DEPLOYMENT_BUCKET" != "None" ]; then
          if aws s3api head-bucket --bucket "$DEPLOYMENT_BUCKET" >/dev/null 2>&1; then
            aws s3 rm "s3://${DEPLOYMENT_BUCKET}" --recursive;
            OBJECT_VERSIONS="$(aws s3api list-object-versions --bucket "$DEPLOYMENT_BUCKET" --query 'Versions[].{Key:Key,VersionId:VersionId}' --output json)";
            if [ "$OBJECT_VERSIONS" != "[]" ] && [ "$OBJECT_VERSIONS" != "null" ]; then
              aws s3api delete-objects --bucket "$DEPLOYMENT_BUCKET" --delete "{\"Objects\":${OBJECT_VERSIONS},\"Quiet\":true}";
            fi;
            DELETE_MARKERS="$(aws s3api list-object-versions --bucket "$DEPLOYMENT_BUCKET" --query 'DeleteMarkers[].{Key:Key,VersionId:VersionId}' --output json)";
            if [ "$DELETE_MARKERS" != "[]" ] && [ "$DELETE_MARKERS" != "null" ]; then
              aws s3api delete-objects --bucket "$DEPLOYMENT_BUCKET" --delete "{\"Objects\":${DELETE_MARKERS},\"Quiet\":true}";
            fi;
          else
            echo "Deployment bucket $DEPLOYMENT_BUCKET does not exist; skipping bucket cleanup.";
          fi;
        fi;
        echo "Deleting CloudFormation stack $AWS_STACK_NAME.";
        aws cloudformation delete-stack --stack-name "$AWS_STACK_NAME";
        aws cloudformation wait stack-delete-complete --stack-name "$AWS_STACK_NAME";
        TEARDOWN_DELETED=1;
      else
        echo "CloudFormation stack $AWS_STACK_NAME does not exist; continuing with orphan cleanup.";
      fi
    - |
      for RULE_NAME in
      micro-bots-production-BirthdayEventsRuleSchedule1-122PCPU44PH95
      micro-bots-production-BirthdayEventsRuleSchedule1-3LMKY1W2V2YD
      micro-bots-production-CoronaHannoverEventsRuleSche-1WLRITILTQ6WG
      micro-bots-production-CoronaHannoverEventsRuleSche-1X8TRPP2EXQ3R
      micro-bots-production-VacationHandoverEventsRuleSc-11I1WXQMUK4CG
      micro-bots-production-VacationHandoverEventsRuleSc-JF74SGXV5LFS
      micro-bots-production-WorkloadAllEventsRuleSchedul-4T08E49BW9EA
      micro-bots-production-WorkloadAllEventsRuleSchedul-USTD6TWUDIVA; do
        if ! aws events describe-rule --event-bus-name default --name "$RULE_NAME" >/dev/null 2>&1; then
          echo "EventBridge rule default/$RULE_NAME does not exist; skipping.";
          continue;
        fi;
        TARGET_IDS="$(aws events list-targets-by-rule --event-bus-name default --rule "$RULE_NAME" --query 'Targets[].Id' --output text 2>/dev/null || true)";
        if [ -n "$TARGET_IDS" ]; then
          aws events remove-targets --event-bus-name default --rule "$RULE_NAME" --ids $TARGET_IDS;
        fi;
        echo "Deleting orphaned EventBridge rule default/$RULE_NAME.";
        aws events delete-rule --event-bus-name default --name "$RULE_NAME";
        TEARDOWN_DELETED=1;
      done
    - |
      if aws events describe-event-bus --name micro-bots-alf >/dev/null 2>&1; then
        RULE_NAMES="$(aws events list-rules --event-bus-name micro-bots-alf --query 'Rules[].Name' --output text)";
        if [ -z "$RULE_NAMES" ]; then
          echo "EventBridge bus micro-bots-alf has no rules.";
        fi;
        for RULE_NAME in $RULE_NAMES; do
          TARGET_IDS="$(aws events list-targets-by-rule --event-bus-name micro-bots-alf --rule "$RULE_NAME" --query 'Targets[].Id' --output text 2>/dev/null || true)";
          if [ -n "$TARGET_IDS" ]; then
            aws events remove-targets --event-bus-name micro-bots-alf --rule "$RULE_NAME" --ids $TARGET_IDS;
          fi;
          echo "Deleting orphaned EventBridge rule micro-bots-alf/$RULE_NAME.";
          aws events delete-rule --event-bus-name micro-bots-alf --name "$RULE_NAME";
        done;
        echo "Deleting orphaned EventBridge bus micro-bots-alf.";
        aws events delete-event-bus --name micro-bots-alf;
        TEARDOWN_DELETED=1;
      else
        echo "EventBridge bus micro-bots-alf does not exist; skipping.";
      fi
    - |
      if [ "$TEARDOWN_DELETED" = "0" ]; then
        echo "AWS teardown found nothing left to delete.";
      else
        echo "AWS teardown completed.";
      fi
